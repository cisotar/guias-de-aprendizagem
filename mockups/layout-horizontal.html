<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup – Guias com filtros em dropdown</title>
<style>
  :root { --bg:#f5f7fa; --card:#fff; --line:#d9dee5; --ink:#1b2430; --muted:#5b6675; --brand:#b51d3f; --soft:#e3eef5; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--ink); display:flex; min-height:100vh; }
  aside { width:280px; padding:20px; border-right:1px solid var(--line); background:var(--card); flex:none; }
  aside h3 { margin:0 0 8px; font-size:15px; }
  aside .ph { height:44px; border:1px solid var(--line); border-radius:8px; margin-bottom:14px; background:#fafbfc; padding:12px; color:var(--muted); }
  main { flex:1; padding:20px 32px; min-width:0; }
  button, select { font:inherit; }
  button { cursor:pointer; }
  :focus-visible { outline:3px solid #1d4ed8; outline-offset:2px; }
  .tabs { display:flex; gap:8px; padding-bottom:12px; border-bottom:1px solid var(--line); }
  .tab { padding:10px 18px; border:1px solid var(--line); border-radius:8px; background:var(--card); font-weight:700; }
  .tab.on { background:var(--brand); color:#fff; border-color:var(--brand); }

  /* Linha 1: modo de visualização */
  .view { display:flex; align-items:center; gap:8px; margin:16px 0 10px; }
  .view > span { font-weight:700; }
  .seg { padding:7px 16px; border:1px solid var(--line); border-radius:8px; background:var(--card); font-weight:600; }
  .seg[aria-pressed="true"] { background:var(--soft); border-color:#7aa7c4; }

  /* Linha 2: dropdowns em cascata (Matéria > Série > Turma) */
  .filters { display:flex; flex-wrap:wrap; gap:12px; padding:12px 16px; background:var(--card); border:1px solid var(--line); border-radius:10px; }
  .field { display:flex; flex-direction:column; gap:4px; min-width:170px; }
  .field label { font-size:12px; font-weight:700; color:var(--muted); }
  .field select { padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  .field select:disabled { background:#f1f3f6; color:var(--muted); }
  .field[hidden] { display:none; }

  .head { display:flex; justify-content:space-between; align-items:flex-start; margin:22px 0 14px; gap:12px; flex-wrap:wrap; }
  .head h1 { margin:0; font-size:24px; }
  .head p { margin:2px 0 0; color:var(--muted); font-size:12px; }
  .actions { display:flex; gap:8px; }
  .btn { padding:8px 14px; border:1px solid var(--line); border-radius:8px; background:var(--card); }
  .terms { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:16px; }
  .term { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .term.on { border:2px solid var(--brand); }
  .term h4 { margin:0 0 6px; font-size:16px; }
  .tag { font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; background:#fdf0c4; }
  .tag.ok { background:#c9f2e4; }
  .term p { margin:8px 0 0; color:var(--muted); }
  .term .btn { width:100%; margin-top:10px; background:#f1f3f6; }
  .empty { background:var(--card); border:1px dashed var(--line); border-radius:10px; padding:28px; text-align:center; color:var(--muted); }
  .doc { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:24px; text-align:center; font-weight:700; }
  .note { margin-top:24px; font-size:12px; color:var(--muted); }
  @media (max-width:900px){ body{flex-direction:column} aside{width:auto} }
</style>
</head>
<body>
<aside>
  <h3>Professor</h3><div class="ph">amanda</div>
  <h3>Bimestres</h3><div class="ph">1º bimestre …</div>
  <h3>Feriados</h3><div class="ph">UF / Município</div>
</aside>

<main>
  <div class="tabs">
    <button class="tab">Minhas matérias</button>
    <button class="tab on">Guias</button>
  </div>

  <div class="view" role="group" aria-label="Ver por">
    <span>Ver por:</span>
    <button class="seg" data-mode="subject" aria-pressed="true">Matéria</button>
    <button class="seg" data-mode="grade" aria-pressed="false">Série</button>
    <button class="seg" data-mode="term" aria-pressed="false">Bimestre</button>
  </div>

  <div class="filters" id="filters">
    <div class="field" id="f-term"><label for="s-term">Bimestre</label><select id="s-term"></select></div>
    <div class="field" id="f-subject"><label for="s-subject">Matéria</label><select id="s-subject"></select></div>
    <div class="field" id="f-grade"><label for="s-grade">Série</label><select id="s-grade"></select></div>
    <div class="field" id="f-class"><label for="s-class">Turma</label><select id="s-class"></select></div>
  </div>

  <div class="head">
    <div><h1 id="title"></h1><p>Professor(a): amanda</p></div>
    <div class="actions"><button class="btn">Copiar guia para outra turma…</button><button class="btn">Imprimir esta guia</button></div>
  </div>

  <div id="content"></div>

  <p class="note">
    Ordem dos dropdowns por visão —
    Matéria: Matéria › Série › Turma ·
    Série: Série › Matéria › Turma ·
    Bimestre: Bimestre › Matéria › Série › Turma.
  </p>
</main>

<script>
  // Dados de exemplo (mesmos do app)
  const DATA = {
    "Ciências":  { "1ª série": [], "2ª série": [], "3ª série": [] },
    "Geografia": { "1ª série": ["Turma A", "Turma B", "Turma D"], "2ª série": ["Turma A", "Turma B", "Turma C"], "3ª série": [] },
  };
  const TERMS = [
    { n: "1º bimestre", range: "01/01 a 01/03", pdf: false },
    { n: "2º bimestre", range: "02/03 a 30/06", pdf: false },
    { n: "3º bimestre", range: "01/08 a 01/10", pdf: false },
    { n: "4º bimestre", range: "02/10 a 18/12", pdf: true },
  ];
  const ORDER = {
    subject: ["subject", "grade", "class"],
    grade:   ["grade", "subject", "class"],
    term:    ["term", "subject", "grade", "class"],
  };
  const $ = (id) => document.getElementById(id);
  const sel = { term: $("s-term"), subject: $("s-subject"), grade: $("s-grade"), class: $("s-class") };
  const fld = { term: $("f-term"), subject: $("f-subject"), grade: $("f-grade"), class: $("f-class") };
  let mode = "subject";

  const fill = (el, items, empty) => {
    const keep = el.value;
    el.innerHTML = "";
    items.forEach((v) => el.add(new Option(v, v)));
    el.disabled = items.length === 0;
    if (!items.length) el.add(new Option(empty, ""));
    if (items.includes(keep)) el.value = keep;
  };

  // Opções de cada dropdown dependem dos que vêm antes dele na ordem da visão
  function options(key) {
    const subjects = Object.keys(DATA);
    const grades = [...new Set(subjects.flatMap((s) => Object.keys(DATA[s])))];
    switch (key) {
      case "term": return TERMS.map((t) => t.n);
      case "subject":
        return mode === "grade" ? subjects.filter((s) => sel.grade.value in DATA[s]) : subjects;
      case "grade":
        return mode === "grade" ? grades : Object.keys(DATA[sel.subject.value] || {});
      case "class":
        return (DATA[sel.subject.value] || {})[sel.grade.value] || [];
    }
  }

  function render() {
    const keys = ORDER[mode];
    // Reordena e mostra só o necessário
    keys.forEach((k, i) => { fld[k].style.order = i; });
    Object.keys(fld).forEach((k) => { fld[k].hidden = !keys.includes(k); });
    // Preenche em cascata, na ordem da visão
    keys.forEach((k) => fill(sel[k], options(k), k === "class" ? "Sem turmas" : "—"));

    const hasClass = sel.class.value !== "";
    const subj = sel.subject.value, grade = sel.grade.value, klass = sel.class.value, term = sel.term.value;
    const where = [subj, grade, klass].filter(Boolean).join(" · ");
    $("title").textContent = mode === "term" ? `${term} — ${where}` : where;

    const shown = mode === "term" ? TERMS.filter((t) => t.n === term) : TERMS;
    const cards = shown.map((t) => `
      <div class="term${mode === "term" ? " on" : ""}">
        <h4>${t.n}</h4>
        <span class="tag${t.pdf ? " ok" : ""}">${t.pdf ? "Editada" : "Falta o PDF"}</span>
        <p>${t.range}</p>
        <button class="btn">${t.pdf ? "Abrir guia" : "Enviar PDF"}</button>
      </div>`).join("");

    $("content").innerHTML = hasClass
      ? `<div class="terms">${cards}</div><div class="doc">GUIA DE APRENDIZAGEM – PEI</div>`
      : `<div class="terms">${cards}</div><div class="empty">Esta série ainda não tem turmas. Cadastre em “Minhas matérias”.</div>`;
  }

  document.querySelectorAll(".seg").forEach((b) => b.addEventListener("click", () => {
    mode = b.dataset.mode;
    document.querySelectorAll(".seg").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    render();
  }));
  Object.values(sel).forEach((s) => s.addEventListener("change", render));
  render();
</script>
</body>
</html>
